<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Formulário — Consultório</title>
<style>
:root{--bg:#f5f2eb;--card:#fff;--text:#2a2a2a;--muted:#777;--accent:#8b9e6e;--border:#e0d9cc}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Arial,sans-serif}.card{width:min(640px,calc(100% - 32px));margin:40px auto;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:28px;box-shadow:0 12px 36px #00000012}h1{font-family:Georgia,serif;margin:0 0 8px}.help{color:var(--muted);line-height:1.5;margin-bottom:22px}label{display:block;margin:16px 0 6px;font-weight:600}input,textarea,select{width:100%;padding:11px;border:1px solid var(--border);border-radius:8px;font:inherit}textarea{min-height:110px;resize:vertical}button{width:100%;margin-top:22px;padding:12px;border:0;border-radius:8px;background:var(--accent);color:#fff;font-weight:700;cursor:pointer}.message{text-align:center;padding:24px;line-height:1.6}.privacy{font-size:12px;color:var(--muted);margin-top:16px;line-height:1.5}
</style>
<script>
/* Máscaras automáticas: CPF (000.000.000-00) e telefone ((00) 00000-0000).
   Valem ao digitar e também quando o valor é preenchido por código (cadastro,
   documentos salvos etc.), garantindo o formato correto em todo o sistema. */
(function(){
  function digitos(v){return String(v==null?'':v).replace(/\D/g,'');}
  function fmtCPF(v){var d=digitos(v).slice(0,11),o=d.slice(0,3);if(d.length>3)o+='.'+d.slice(3,6);if(d.length>6)o+='.'+d.slice(6,9);if(d.length>9)o+='-'+d.slice(9,11);return o;}
  function fmtTel(v){var s=String(v==null?'':v).trim();if(s[0]==='+')return s;var d=digitos(s).slice(0,11);if(!d)return '';if(d.length<3)return '('+d;var o='('+d.slice(0,2)+') ';if(d.length<=6)return o+d.slice(2);if(d.length<=10)return o+d.slice(2,d.length-4)+'-'+d.slice(d.length-4);return o+d.slice(2,7)+'-'+d.slice(7);}
  function tipo(el){if(!el||el.tagName!=='INPUT')return null;var k=(el.id||'')+' '+(el.name||'');if(/cpf/i.test(k))return 'cpf';if(/telefone|celular|whatsapp|fone/i.test(k)||el.type==='tel')return 'tel';return null;}
  function aplicar(el,v){var t=tipo(el);return t==='cpf'?fmtCPF(v):t==='tel'?fmtTel(v):v;}
  var d=Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value');
  Object.defineProperty(HTMLInputElement.prototype,'value',{configurable:true,enumerable:d.enumerable,get:function(){return d.get.call(this);},set:function(v){d.set.call(this,tipo(this)&&v?aplicar(this,v):v);}});
  document.addEventListener('input',function(e){var el=e.target,t=tipo(el);if(!t||e.isComposing)return;var atual=d.get.call(el),novo=aplicar(el,atual);if(novo!==atual)d.set.call(el,novo);},true);
  window.fmtCPF=fmtCPF;window.fmtTelefone=fmtTel;
})();
</script>
</head>
<body>
<main class="card">
  <div id="loading" class="message">Carregando formulário...</div>
  <form id="form" hidden>
    <h1 id="title"></h1><p class="help" id="purpose"></p><div id="fields"></div>
    <p class="privacy">Suas informações serão enviadas de forma segura.</p>
    <button id="submit" type="submit">Enviar respostas</button>
  </form>
  <div id="message" class="message" hidden></div>
</main>
<script>
const token=new URLSearchParams(location.search).get('token')||'';
const form=document.getElementById('form'),message=document.getElementById('message');
function done(text){document.getElementById('loading').hidden=true;form.hidden=true;message.hidden=false;message.textContent=text}
async function init(){
  try{
    const r=await fetch('/api/form?token='+encodeURIComponent(token),{cache:'no-store'}),d=await r.json();if(!r.ok)throw new Error(d.error);
    document.getElementById('loading').hidden=true;form.hidden=false;document.getElementById('title').textContent=d.nome;document.getElementById('purpose').textContent=d.finalidade;
    const fields=document.getElementById('fields');
    let secaoAtual=null;
    (d.campos||[]).forEach((f,i)=>{
      if(f.secao&&f.secao!==secaoAtual){secaoAtual=f.secao;const h=document.createElement('h2');h.textContent=secaoAtual;h.style.cssText='font:600 1.02rem Georgia,serif;margin:26px 0 4px;padding-top:16px;border-top:1px solid var(--border)';fields.append(h);}
      const label=document.createElement('label');label.textContent=f.label||`Pergunta ${i+1}`;
      const input=document.createElement(f.type==='textarea'?'textarea':f.type==='select'?'select':'input');
      input.name=f.key||`campo_${i+1}`;input.required=!!f.required;
      if(input.tagName==='INPUT')input.type=f.type||'text';
      if(input.tagName==='SELECT')(f.options||[]).forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;input.appendChild(o)});
      fields.append(label,input);
    });
  }catch(e){done('Este link é inválido, expirou ou já foi utilizado.');}
}
form.addEventListener('submit',async e=>{
  e.preventDefault();const button=document.getElementById('submit');button.disabled=true;const conteudo=Object.fromEntries(new FormData(form));
  try{const r=await fetch('/api/form',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,conteudo})}),d=await r.json();if(!r.ok)throw new Error(d.error);done('Obrigada! Suas informações foram enviadas e serão anexadas ao seu prontuário.');}
  catch(e){button.disabled=false;alert(e.message||'Não foi possível enviar.');}
});
init();
</script>
</body>
</html>
