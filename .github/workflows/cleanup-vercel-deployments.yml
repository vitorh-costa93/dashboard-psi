name: Limpar deploys antigos da Vercel

# Plano Hobby da Vercel nao tem controle nativo de retencao de deploy --
# cada deploy fica guardado pra sempre e conta pro limite gratuito de 10GB
# de "Deployment Storage" (foi o que disparou um alerta de 75% de uso, com
# 216 deploys acumulados em ~26 dias). Mantem so o de producao atual + as
# ultimas entregas mais recentes (ver DEPLOYMENTS_TO_KEEP abaixo).
on:
  schedule:
    - cron: '0 6 * * *' # todo dia as 06:00 UTC (03:00 em Brasilia)
  workflow_dispatch: {} # permite rodar manualmente pela aba Actions no GitHub
  # Logo depois de cada deploy de producao feito pela integracao GitHub da
  # Vercel: reaponta o alias manual dos formularios em minutos, sem esperar a
  # rodada diaria (que continua cobrindo deploys feitos pelo CLI).
  deployment_status:

concurrency:
  group: cleanup-vercel
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.event_name != 'deployment_status' || (github.event.deployment_status.state == 'success' && contains(github.event.deployment_status.environment, 'Production'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/cleanup-vercel-deployments.mjs
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENTS_TO_KEEP: '4'
