name: Reaplicar cadastro aprovado
on:
  workflow_dispatch:
    inputs:
      response_id:
        description: ID da resposta cadastral já aprovada
        required: true
        type: string
      apply:
        description: Aplicar os campos da resposta no perfil
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  reconcile:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Aplicar e verificar cadastro em produção
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          RESPONSE_ID: ${{ inputs.response_id }}
          APPLY: ${{ inputs.apply }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [ "$APPLY" = 'true' ]; then args+=(--apply); fi
          node scripts/reconcile-approved-registration.mjs "$RESPONSE_ID" "${args[@]}"
